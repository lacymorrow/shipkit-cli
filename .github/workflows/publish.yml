name: Publish to npm

# Publishes create-shipkit-app when a v* tag is pushed. There is no NPM_TOKEN in
# this repo: npm gets its credential from GitHub's OIDC provider at publish time
# (npm trusted publishing), so `id-token: write` on the publish job is
# load-bearing. Provenance attaches automatically for a public package in a
# public repo. Same shape as lacymorrow/react-github-readme-md release.yml
# (LAC-7834).
#
# Two jobs on purpose. `id-token: write` is job-wide, so any step in a job that
# holds it can mint an npm credential. Everything that runs third-party code
# (`bun install`, tsc, tsup) lives in `verify`, which has no id-token. `publish`
# runs no third-party JS: it checks out, downloads the dist/ that `verify`
# built, compares tag to package.json, and publishes.
#
# One-time setup on npmjs.com, package create-shipkit-app,
# Settings -> Trusted publisher:
#   Publisher: GitHub Actions
#   Organization or user: lacymorrow
#   Repository: shipkit-cli
#   Workflow filename: publish.yml   (filename only, must match this file)
#   Environment: leave blank (any pushed v* tag publishes, no approval click)
# npm does not validate the config on save, fields are case sensitive, it
# cannot be edited, and it expires unless its first publish lands within 2
# days. So cut the release tag right after saving it.
#
# Needs npm >= 11.5.1, Node >= 22.14.0, and a cloud-hosted runner.
#
# Actions are pinned by SHA because this file can mint a publish credential.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: node dist/index.js --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest # trusted publishing does not work on self-hosted runners
    permissions:
      contents: read
      id-token: write # required for OIDC; without it npm publish has no credential

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: npm is new enough for OIDC
        run: |
          need=11.5.1
          have=$(npm -v)
          echo "npm $have"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have cannot publish via OIDC; need >= $need" >&2
            exit 1
          fi

      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME is $tag but package.json is $pkg" >&2
            exit 1
          fi

      # Both `bin` entries point at dist/index.js. If the artifact came down
      # empty or in the wrong place, publishing would ship a package with no CLI.
      - name: Tarball contains the entry points
        run: |
          files="$(npm pack --dry-run --json --ignore-scripts | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              for (const f of JSON.parse(s)[0].files) console.log(f.path);
            });
          ')"
          if ! printf '%s\n' "$files" | grep -qx 'dist/index.js'; then
            echo "dist/index.js (target of both bin entries) is not in the tarball" >&2
            exit 1
          fi

      # --ignore-scripts: no node_modules here on purpose, and the `prepare`
      # script would otherwise try to rebuild with tsup. dist/ came from verify.
      - name: Publish
        run: npm publish --access public --ignore-scripts # credential comes from OIDC, not a token
